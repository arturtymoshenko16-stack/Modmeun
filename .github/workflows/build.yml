name: Build libGkModMenu.so
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: |
          cd src/*/
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -name libGkModMenu.so -path "*arm64-v8a*" -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/" || true
      - uses: actions/upload-artifact@v4
        with:
          name: libGkModMenu
          path: out/
