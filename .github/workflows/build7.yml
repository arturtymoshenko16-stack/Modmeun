name: Build libGkModMenu v7
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip -d src
      - name: Fix sources
        run: |
          F=$(ls src/*/app/src/main/cpp/main.cpp)
          sed -i '/#define LOGI/a static std::mutex gFeatureMutex;\nstatic std::unordered_map<int, bool> gFeatureStates;' "$F"
          sed -i "s|iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII=||g" "$F"
          G=$(ls src/*/app/build.gradle)
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'arm64-v8a', 'armeabi-v7a'/; s/minSdk 23/minSdk 21/" "$G"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "cmake;3.22.1" "ndk;25.1.8937393"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: |
          cd src/*/
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in $(find . -name libGkModMenu.so -path "*/obj/*"); do
            a=$(basename "$(dirname "$f")")
            cp "$f" "$GITHUB_WORKSPACE/out/libGkModMenu_$a.so"
          done
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/" || true
      - uses: actions/upload-artifact@v4
        with:
          name: libGkModMenu-v7
          path: out/
