name: Build MOD MENU v8
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip -d src
      - name: Fix sources
        run: |
          F=$(ls src/*/app/src/main/cpp/main.cpp)
          sed -i '/#define LOGI/a static std::mutex gFeatureMutex;\nstatic std::unordered_map<int, bool> gFeatureStates;' "$F"
          sed -i "s|iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII=||g" "$F"
          sed -i 's|"Button_Check IL2CPP status"|"Button_Check IL2CPP status",\n            "Collapse_Slider",\n            "CollapseAdd_SeekBar_Value_1_100"|' "$F"
          grep -rl "MOD%
